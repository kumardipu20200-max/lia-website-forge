<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIA AI Voice Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0b0c10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff4d88;
    }
    .api-btn {
      background: #1f222e;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-text {
      color: #aaa;
      font-size: 0.95rem;
      margin-top: 5px;
      text-align: center;
    }
    .sphere-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 280px;
      height: 280px;
      margin: 20px 0;
    }
    .sphere {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 2px solid #ff007f;
      box-shadow: 0 0 40px #ff007f88, inset 0 0 40px #ff007f88;
      background: radial-gradient(circle, rgba(255,0,128,0.15) 0%, rgba(0,0,0,0.8) 70%);
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 25px #ff007f); }
    }
    .msg-box {
      background: rgba(25, 20, 30, 0.9);
      border: 1px solid #ff4d8844;
      border-radius: 16px;
      padding: 15px 20px;
      max-width: 90%;
      text-align: center;
      font-size: 0.95rem;
      color: #eee;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-box {
      color: #ff6b6b;
      border-color: #ff6b6b;
    }
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .mic-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, #ff4d88 0%, #d81b60 100%);
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 77, 136, 0.6);
      transition: transform 0.2s;
    }
    .mic-btn:active {
      transform: scale(0.92);
    }
    .note {
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand">LIA ❤️</div>
      <div class="status-text" id="status">सुन रही हूँ... ('लिया' बोलिए)</div>
    </div>
    <button class="api-btn" onclick="setApiKey()">⚙️ API Key</button>
  </header>

  <div class="sphere-container">
    <div class="sphere" id="sphere"></div>
  </div>

  <div class="msg-box" id="outputBox">
    सुना: "हेलो लिया"
  </div>

  <footer>
    <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤</button>
    <div class="note">कमांड से पहले "लिया" बोलना ज़रूरी है</div>
  </footer>

  <script>
    const outputBox = document.getElementById("outputBox");
    const statusText = document.getElementById("status");
    let recognition;
    let isListening = false;

    // LocalStorage से API Key प्राप्त करें
    function getApiKey() {
      let key = localStorage.getItem("GEMINI_API_KEY");
      if (!key) {
        key = prompt("कृपया अपनी Google AI Studio की मुफ़्त API Key दर्ज करें:");
        if (key) {
          localStorage.setItem("GEMINI_API_KEY", key.trim());
        }
      }
      return key;
    }

    function setApiKey() {
      const currentKey = localStorage.getItem("GEMINI_API_KEY") || "";
      const newKey = prompt("अपनी मुफ़्त Google AI Studio API Key दर्ज करें:", currentKey);
      if (newKey !== null && newKey.trim() !== "") {
        localStorage.setItem("GEMINI_API_KEY", newKey.trim());
        alert("API Key सफलतापूर्वक सेव हो गई!");
      }
    }

    // Google AI Studio - Free Tier Supported Model
    async function askGemini(promptText) {
      const apiKey = getApiKey();
      if (!apiKey) {
        showError("API Key नहीं मिली। कृपया ऊपर 'API Key' बटन दबाकर की दर्ज करें।");
        return;
      }

      // मुफ़्त टियर के लिए gemini-2.5-flash
      const MODEL_NAME = "gemini-3.8-flash";


      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

      const payload = {
        contents: [
          {
            role: "user",
            parts: [{ text: promptText }]
          }
        ],
        systemInstruction: {
          parts: [
            {
              text: "आपका नाम 'लिया' (LIA) है। आप एक बहुत ही प्यारी, बुद्धिमान और मददगार AI वॉइस असिस्टेंट हैं। उपयोगकर्ता से हमेशा सम्मानपूर्वक और सीधे शुद्ध/सरल हिंदी में बात करें। जवाब छोटे और बातचीत वाले रखें।"
            }
          ]
        },
        generationConfig: {
          temperature: 0.7,
          maxOutputTokens: 250
        }
      };

      try {
        statusText.innerText = "लिया सोच रही है...";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.error) {
          showError("त्रुटि: " + data.error.message);
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          outputBox.classList.remove("error-box");
          outputBox.innerText = reply;
          speakText(reply);
        } else {
          showError("कोई जवाब प्राप्त नहीं हुआ।");
        }
      } catch (err) {
        showError("कनेक्शन में समस्या आई: " + err.message);
      } finally {
        statusText.innerText = "सुन रही हूँ... ('लिया' बोलिए)";
      }
    }

    // आवाज़ में जवाब देना (Text-to-Speech)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "hi-IN";
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function showError(msg) {
      outputBox.classList.add("error-box");
      outputBox.innerText = msg;
      statusText.innerText = "त्रुटि हुई";
    }

    // आवाज़ पहचानना (Speech-to-Text)
    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showError("आपके ब्राउज़र में वॉइस सपोर्ट नहीं है। कृपया Chrome इस्तेमाल करें।");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const lastResult = event.results[event.results.length - 1][0].transcript.trim();
        outputBox.classList.remove("error-box");
        outputBox.innerText = 'सुना: "' + lastResult + '"';

        const lower = lastResult.toLowerCase();
        if (lower.includes("लिया") || lower.includes("lia")) {
          const cleanPrompt = lastResult.replace(/लिया|lia/gi, "").trim();
          askGemini(cleanPrompt || "नमस्ते लिया!");
        }
      };

      recognition.onerror = (e) => {
        console.error("Speech Error:", e);
      };
    }

    function toggleListening() {
      if (!recognition) initSpeech();
      if (!recognition) return;

      if (!isListening) {
        recognition.start();
        isListening = true;
        document.getElementById("micBtn").style.boxShadow = "0 0 35px #00e676";
      } else {
        recognition.stop();
        isListening = false;
        document.getElementById("micBtn").style.boxShadow = "0 0 25px rgba(255, 77, 136, 0.6)";
      }
    }

    window.onload = () => {
      initSpeech();
    };
  </script>
</body>
</html>
