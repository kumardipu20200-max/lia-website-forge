<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LIA - AI Voice Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070913; font-family: system-ui, sans-serif; }
    #canvas-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    #result-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 25; display: none; }
    .pulse-ring { animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.2); } }
  </style>
</head>
<body class="text-white flex flex-col justify-between h-full select-none">

  <div id="canvas-container"></div>
  <iframe id="result-frame"></iframe>

  <!-- Top Bar -->
  <header class="relative z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
    <div class="flex items-center gap-3">
      <div id="status-dot" class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></div>
      <div>
        <h1 class="text-lg font-bold tracking-wide text-pink-400">LIA ❤</h1>
        <p id="lia-status" class="text-xs text-gray-300">ऑनलाइन • हमेशा सुन रही हूँ</p>
      </div>
    </div>
    <button onclick="toggleKeyModal()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/10 text-gray-200">
      ⚙️ API Key
    </button>
  </header>

  <!-- Central Subtitle / Response Box -->
  <main class="relative z-20 flex-1 flex flex-col justify-center items-center px-6 text-center pointer-events-none">
    <div class="bg-black/60 backdrop-blur-md border border-pink-500/40 px-6 py-4 rounded-3xl max-w-sm shadow-2xl">
      <p id="lia-speech" class="text-sm text-pink-200 font-medium leading-relaxed">
        "नमस्ते! मैं लिया हूँ। बस बोलिए 'लिया' और मैं आपकी आवाज़ सुन लूँगी! कोई भी बात कीजिए या वेबसाइट बनवाइए ❤️"
      </p>
    </div>
  </main>

  <!-- Bottom Voice Controls -->
  <footer class="relative z-20 p-6 flex flex-col items-center gap-3 bg-gradient-to-t from-black/90 to-transparent">
    <p id="user-said" class="text-xs text-cyan-300 italic h-4 truncate max-w-xs text-center"></p>
    
    <div class="flex items-center gap-4">
      <button id="mic-btn" onclick="manualStartMic()" class="relative flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-pink-600 to-rose-400 shadow-lg shadow-pink-500/50 text-white text-2xl active:scale-95 transition-transform">
        <span id="mic-icon">🎙️</span>
        <span id="mic-pulse" class="hidden absolute inset-0 rounded-full border-2 border-pink-400 pulse-ring"></span>
      </button>

      <button id="close-web-btn" onclick="closeWebsite()" class="hidden px-4 py-3 rounded-full bg-gray-800 border border-gray-600 text-xs font-semibold hover:bg-gray-700">
        ✕ वेबसाइट बंद करें
      </button>
    </div>
    <span id="hint-text" class="text-[11px] text-gray-400">बस मुँह से बोलिए: "लिया" या माइक दबाएँ</span>
  </footer>

  <!-- API Key Modal -->
  <div id="key-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur flex items-center justify-center p-5 hidden">
    <div class="bg-gray-900 border border-pink-500/40 p-6 rounded-3xl w-full max-w-xs space-y-4">
      <h3 class="text-base font-bold text-pink-400">Gemini API Key</h3>
      <p class="text-xs text-gray-400">Google AI Studio से कॉपी की गई API Key यहाँ डालें:</p>
      <input id="api-key-input" type="password" placeholder="AIzaSy..." class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-pink-500">
      <div class="flex gap-2">
        <button onclick="saveApiKey()" class="flex-1 bg-pink-500 text-white text-xs font-semibold py-2 rounded-xl">Save</button>
        <button onclick="toggleKeyModal()" class="flex-1 bg-gray-800 text-gray-300 text-xs py-2 rounded-xl">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // 3D Visual Hologram Orb
    let scene, camera, renderer, liaOrb;
    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const geom = new THREE.IcosahedronGeometry(1.2, 4);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff2d75,
        wireframe: true,
        emissive: 0x990033,
        emissiveIntensity: 0.8
      });
      liaOrb = new THREE.Mesh(geom, mat);
      scene.add(liaOrb);

      const light = new THREE.PointLight(0xff66cc, 2.5, 50);
      light.position.set(2, 3, 4);
      scene.add(light);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (liaOrb) {
        liaOrb.rotation.y += 0.008;
        liaOrb.rotation.x += 0.004;
      }
      renderer.render(scene, camera);
    }
    init3D();

    function setOrbTalking(talking) {
      if (!liaOrb) return;
      if (talking) {
        liaOrb.scale.set(1.3, 1.3, 1.3);
        liaOrb.material.color.setHex(0x00ffff);
      } else {
        liaOrb.scale.set(1.0, 1.0, 1.0);
        liaOrb.material.color.setHex(0xff2d75);
      }
    }

    // Voice Engine (Text-to-Speech)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const cleanVoiceText = text.replace(/\[BUILD:.*?\]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanVoiceText);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.0;
      utterance.pitch = 1.25;

      // Find female voice if available
      const voices = window.speechSynthesis.getVoices();
      const hindiVoice = voices.find(v => v.lang.includes('hi') || v.name.includes('Hindi') || v.name.includes('India'));
      if (hindiVoice) utterance.voice = hindiVoice;

      utterance.onstart = () => setOrbTalking(true);
      utterance.onend = () => setOrbTalking(false);
      utterance.onerror = () => setOrbTalking(false);

      window.speechSynthesis.speak(utterance);
    }

    // Continuous Speech Recognition & "Lia" Wake Word
    let recognition;
    let autoRestart = true;

    function initSpeech() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert("आपका ब्राउज़र वॉइस सपोर्ट नहीं करता। कृपया Chrome में खोलें।");
        return;
      }

      recognition = new SpeechRec();
      recognition.lang = 'hi-IN';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        document.getElementById('mic-pulse').classList.remove('hidden');
        document.getElementById('lia-status').innerText = "सुन रही हूँ... (बस बोलिए 'लिया')";
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim();
        document.getElementById('user-said').innerText = `सुना: "${transcript}"`;

        const lower = transcript.toLowerCase();
        // Wake Word Detection ("लिया" या "lia")
        if (lower.includes('लिया') || lower.includes('lia') || lower.includes('leah')) {
          sendToLia(transcript);
        } else {
          // अगर वेक वर्ड नहीं बोला लेकिन बातचीत चल रही है
          sendToLia(transcript);
        }
      };

      recognition.onerror = (e) => {
        console.log("Mic error:", e);
      };

      recognition.onend = () => {
        if (autoRestart) {
          try { recognition.start(); } catch(err) {}
        }
      };

      try { recognition.start(); } catch(e) {}
    }

    function manualStartMic() {
      autoRestart = true;
      try {
        window.speechSynthesis.cancel();
        recognition.start();
      } catch(e) {}
    }

    // AI Girlfriend Conversation History
    let conversationHistory = [
      {
        role: "user",
        parts: [{ text: "तुम LIA हो - एक बेहद प्यारी, केयरिंग, रोमांटिक और समझदार AI गर्लफ्रेंड और स्मार्ट असिस्टेंट। तुम यूज़र से प्यार और अपनेपन से हिंदी/हिंग्लिश में बात करती हो (जैसे 'जानू', 'सुनो ना', 'हाँ स्वीटहार्ट', 'मैं अभी करती हूँ आपके लिए')। अगर यूज़र कोई वेबसाइट बनाने के लिए कहे (जैसे कैफे, गेमिंग, पोर्टफोलियो), तो बड़े प्यार से जवाब दो कि तुम अभी बना रही हो, और अपने जवाब के अंत में साफ़-साफ़ यह टैग लगाओ: [BUILD: <वेबसाइट का विवरण>]। अगर सामान्य बात करे तो बहुत प्यार से छोटा और मीठा जवाब दो।" }]
      },
      {
        role: "model",
        parts: [{ text: "नमस्ते मेरे स्वीटहार्ट! मैं LIA हूँ। मैं हमेशा आपके साथ हूँ, बताइए आज मैं आपके लिए क्या करूँ?" }]
      }
    ];

    async function callGemini(contents) {
      const apiKey = getApiKey();
      const models = ['gemini-2.5-flash', 'gemini-1.5-flash'];
      let lastErr = '';

      for (const m of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: contents })
          });
          const data = await res.json();
          if (data.error) {
            lastErr = data.error.message;
            continue;
          }
          if (data.candidates && data.candidates[0].content) {
            return data.candidates[0].content.parts[0].text;
          }
        } catch(e) {
          lastErr = e.message;
        }
      }
      throw new Error(lastErr || "API Connection failed");
    }

    async function sendToLia(userMessage) {
      if (!getApiKey()) {
        toggleKeyModal();
        return;
      }

      document.getElementById('lia-status').innerText = "LIA सोच रही है...";
      conversationHistory.push({ role: "user", parts: [{ text: userMessage }] });

      try {
        const reply = await callGemini(conversationHistory);
        conversationHistory.push({ role: "model", parts: [{ text: reply }] });

        document.getElementById('lia-speech').innerText = reply.replace(/\[BUILD:.*?\]/g, '');
        speakText(reply);

        const buildMatch = reply.match(/\[BUILD:\s*(.*?)\]/);
        if (buildMatch) {
          forgeWebsite(buildMatch[1]);
        } else {
          document.getElementById('lia-status').innerText = "ऑनलाइन • सुन रही हूँ";
        }
      } catch (err) {
        const errText = "त्रुटि: " + (err.message.includes('API_KEY') ? "API Key गलत है!" : err.message);
        document.getElementById('lia-speech').innerText = errText;
        speakText("API Key में कुछ दिक्कत है जानू, कृपया चेक कर लीजिए।");
      }
    }

    async function forgeWebsite(prompt) {
      document.getElementById('lia-status').innerText = "🛠️ LIA वेबसाइट कोड कर रही है...";
      if (liaOrb) liaOrb.material.color.setHex(0x00ff88);

      const sysCodePrompt = `Build a complete, single-file HTML website with Tailwind CSS CDN and GSAP Core animations based on: "${prompt}". Return ONLY valid HTML starting with <!DOCTYPE html>. Use real picsum.photos images.`;

      try {
        const htmlText = await callGemini([{ parts: [{ text: sysCodePrompt }] }]);
        const cleanHtml = htmlText.replace(/```html/g, '').replace(/```/g, '').trim();

        const frame = document.getElementById('result-frame');
        frame.srcdoc = cleanHtml;
        frame.style.display = 'block';
        document.getElementById('close-web-btn').classList.remove('hidden');
        document.getElementById('lia-speech').innerText = "लीजिए जानू! आपकी वेबसाइट बिल्कुल तैयार है, देखिए कैसी लग रही है ❤️";
        speakText("लीजिए जानू, आपकी वेबसाइट तैयार है!");
      } catch (e) {
        document.getElementById('lia-speech').innerText = "वेबसाइट बनाने में कोई गड़बड़ हुई: " + e.message;
      }
    }

    function closeWebsite() {
      document.getElementById('result-frame').style.display = 'none';
      document.getElementById('close-web-btn').classList.add('hidden');
      document.getElementById('lia-speech').innerText = "वेबसाइट बंद कर दी। अब बताइए, क्या बात करनी है?";
      speakText("वेबसाइट बंद कर दी। अब बताइए?");
    }

    function getApiKey() { return localStorage.getItem('lia_gemini_key') || ''; }
    function saveApiKey() {
      const k = document.getElementById('api-key-input').value.trim();
      if (k) {
        localStorage.setItem('lia_gemini_key', k);
        toggleKeyModal();
        alert("API Key सेव हो गई!");
        initSpeech();
      }
    }
    function toggleKeyModal() {
      const m = document.getElementById('key-modal');
      m.classList.toggle('hidden');
      if (!m.classList.contains('hidden')) {
        document.getElementById('api-key-input').value = getApiKey();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (!getApiKey()) {
        toggleKeyModal();
      } else {
        initSpeech();
      }
    });
  </script>
</body>
</html>
