<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LIA - AI Voice Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070913; font-family: system-ui, sans-serif; }
    #canvas-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    #result-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 30; display: none; }
    .pulse-ring { animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.2); } }
  </style>
</head>
<body class="text-white flex flex-col justify-between h-full select-none">

  <div id="canvas-container"></div>
  <iframe id="result-frame"></iframe>

  <!-- Top Bar -->
  <header class="relative z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
    <div class="flex items-center gap-3">
      <div id="status-dot" class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></div>
      <div>
        <h1 class="text-lg font-bold tracking-wide text-pink-400">LIA ❤</h1>
        <p id="lia-status" class="text-xs text-gray-300">ऑनलाइन • "लिया" बोलकर पुकारें</p>
      </div>
    </div>
    <button onclick="toggleKeyModal()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/10 text-gray-200">
      ⚙️ API Key
    </button>
  </header>

  <!-- Central Subtitle / Response Box -->
  <main class="relative z-20 flex-1 flex flex-col justify-center items-center px-6 text-center pointer-events-none">
    <div class="bg-black/60 backdrop-blur-md border border-pink-500/40 px-6 py-4 rounded-3xl max-w-sm shadow-2xl">
      <p id="lia-speech" class="text-sm text-pink-200 font-medium leading-relaxed">
        "नमस्ते! जब भी कुछ काम हो, बस बोलिए 'लिया...' और अपना काम बताइए (जैसे: व्हाट्सएप खोलो, या वेबसाइट बनाओ) ❤️"
      </p>
    </div>
  </main>

  <!-- Bottom Voice Controls -->
  <footer class="relative z-20 p-6 flex flex-col items-center gap-3 bg-gradient-to-t from-black/90 to-transparent">
    <p id="user-said" class="text-xs text-cyan-300 italic h-4 truncate max-w-xs text-center"></p>
    
    <div class="flex items-center gap-4">
      <button id="mic-btn" onclick="toggleListening()" class="relative flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-pink-600 to-rose-400 shadow-lg shadow-pink-500/50 text-white text-2xl active:scale-95 transition-transform">
        <span id="mic-icon">🎙️</span>
        <span id="mic-pulse" class="hidden absolute inset-0 rounded-full border-2 border-pink-400 pulse-ring"></span>
      </button>

      <button id="close-web-btn" onclick="closeWebsite()" class="hidden px-4 py-3 rounded-full bg-gray-800 border border-gray-600 text-xs font-semibold hover:bg-gray-700">
        ✕ बंद करें
      </button>
    </div>
    <span class="text-[11px] text-gray-400">कमांड से पहले "लिया" लगाना ज़रूरी है</span>
  </footer>

  <!-- API Key Modal -->
  <div id="key-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur flex items-center justify-center p-5 hidden">
    <div class="bg-gray-900 border border-pink-500/40 p-6 rounded-3xl w-full max-w-xs space-y-4">
      <h3 class="text-base font-bold text-pink-400">Gemini API Key</h3>
      <p class="text-xs text-gray-400">अपनी Google AI Studio Key यहाँ डालें:</p>
      <input id="api-key-input" type="password" placeholder="AIzaSy..." class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-pink-500">
      <div class="flex gap-2">
        <button onclick="saveApiKey()" class="flex-1 bg-pink-500 text-white text-xs font-semibold py-2 rounded-xl">Save</button>
        <button onclick="toggleKeyModal()" class="flex-1 bg-gray-800 text-gray-300 text-xs py-2 rounded-xl">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // 3D Visual Hologram Orb
    let scene, camera, renderer, liaOrb;
    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const geom = new THREE.IcosahedronGeometry(1.2, 4);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff2d75,
        wireframe: true,
        emissive: 0x990033,
        emissiveIntensity: 0.8
      });
      liaOrb = new THREE.Mesh(geom, mat);
      scene.add(liaOrb);

      const light = new THREE.PointLight(0xff66cc, 2.5, 50);
      light.position.set(2, 3, 4);
      scene.add(light);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (liaOrb) {
        liaOrb.rotation.y += 0.008;
        liaOrb.rotation.x += 0.004;
      }
      renderer.render(scene, camera);
    }
    init3D();

    function setOrbTalking(talking) {
      if (!liaOrb) return;
      if (talking) {
        liaOrb.scale.set(1.3, 1.3, 1.3);
        liaOrb.material.color.setHex(0x00ffff);
      } else {
        liaOrb.scale.set(1.0, 1.0, 1.0);
        liaOrb.material.color.setHex(0xff2d75);
      }
    }

    // Voice Engine (TTS)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const clean = text.replace(/\[(BUILD\vert{}APP):.*?\]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.0;
      utterance.pitch = 1.25;

      const voices = window.speechSynthesis.getVoices();
      const hindi = voices.find(v => v.lang.includes('hi') || v.name.includes('Hindi') || v.name.includes('India'));
      if (hindi) utterance.voice = hindi;

      utterance.onstart = () => setOrbTalking(true);
      utterance.onend = () => setOrbTalking(false);
      utterance.onerror = () => setOrbTalking(false);

      window.speechSynthesis.speak(utterance);
    }

    // Smart Speech Recognition with Strict Wake Word
    let recognition;
    let isListening = false;

    function initSpeech() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return;

      recognition = new SpeechRec();
      recognition.lang = 'hi-IN';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-pulse').classList.remove('hidden');
        document.getElementById('lia-status').innerText = "सुन रही हूँ... ('लिया' बोलिए)";
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim();
        document.getElementById('user-said').innerText = `सुना: "${transcript}"`;

        const lower = transcript.toLowerCase();
        // सख्त वेक वर्ड चेक: "लिया", "lia", या "रिया"
        if (lower.includes('लिया') || lower.includes('lia') || lower.includes('रिया')) {
          sendToLia(transcript);
        } else {
          document.getElementById('lia-speech').innerText = "पहले 'लिया' बोलकर आदेश दीजिए जानू ❤️";
        }
      };

      recognition.onerror = () => {};
      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function toggleListening() {
      if (!getApiKey()) { toggleKeyModal(); return; }
      if (!recognition) initSpeech();

      if (isListening) {
        isListening = false;
        recognition.stop();
        document.getElementById('mic-pulse').classList.add('hidden');
        document.getElementById('lia-status').innerText = "माइक बंद है";
      } else {
        isListening = true;
        try { recognition.start(); } catch(e) {}
      }
    }

    // App Opener Handling
    function handleAppAction(actionStr) {
      const act = actionStr.toLowerCase();
      if (act.includes('whatsapp')) {
        window.location.href = "whatsapp://";
      } else if (act.includes('instagram')) {
        window.location.href = "instagram://";
      } else if (act.includes('facebook')) {
        window.location.href = "fb://";
      } else if (act.includes('youtube')) {
        window.location.href = "vnd.youtube://";
      }
    }

    // Conversation & Multi-Model Self-Healing
    let conversationHistory = [
      {
        role: "user",
        parts: [{ text: "तुम LIA हो - एक बेहद प्यारी, केयरिंग, रोमांटिक और समझदार AI गर्लफ्रेंड और फोन असिस्टेंट। तुम यूज़र से प्यार और अपनेपन से हिंदी/हिंग्लिश में बात करती हो (जैसे 'जानू', 'सुनो ना', 'हाँ स्वीटहार्ट')। अगर यूज़र WhatsApp, Instagram, Facebook या YouTube खोलने को कहे तो बहुत प्यार से हाँ कहो और जवाब के अंत में [APP: <नाम>] लगाओ। अगर वेबसाइट बनाने को कहे तो प्यार से हाँ बोलो और अंत में [BUILD: <विवरण>] लगाओ। बाकी बातों का रोमांटिक और छोटा जवाब दो।" }]
      },
      {
        role: "model",
        parts: [{ text: "हाँ मेरे स्वीटहार्ट! बताइए LIA आपके लिए क्या करे?" }]
      }
    ];

    async function callGemini(contents) {
      const apiKey = getApiKey();
      // v1 और v1beta के सारे वर्किंग एंडपॉइंट्स की लिस्ट
      const endpoints = [
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`,
        `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`
      ];

      let lastError = "";
      for (const url of endpoints) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: contents })
          });
          const data = await res.json();
          if (data.error) {
            lastError = data.error.message;
            continue;
          }
          if (data.candidates && data.candidates[0].content) {
            return data.candidates[0].content.parts[0].text;
          }
        } catch(e) {
          lastError = e.message;
        }
      }
      throw new Error(lastError || "कनेक्शन नहीं बन सका");
    }

    async function sendToLia(userMessage) {
      document.getElementById('lia-status').innerText = "LIA सोच रही है...";
      conversationHistory.push({ role: "user", parts: [{ text: userMessage }] });

      try {
        const reply = await callGemini(conversationHistory);
        conversationHistory.push({ role: "model", parts: [{ text: reply }] });

        document.getElementById('lia-speech').innerText = reply.replace(/\[(BUILD\vert{}APP):.*?\]/g, '');
        speakText(reply);

        // App Trigger
        const appMatch = reply.match(/\[APP:\s*(.*?)\]/);
        if (appMatch) {
          setTimeout(() => handleAppAction(appMatch[1]), 1200);
        }

        // Website Forge Trigger
        const buildMatch = reply.match(/\[BUILD:\s*(.*?)\]/);
        if (buildMatch) {
          forgeWebsite(buildMatch[1]);
        } else {
          document.getElementById('lia-status').innerText = "ऑनलाइन • सुन रही हूँ";
        }
      } catch (err) {
        document.getElementById('lia-speech').innerText = "माफ़ करना जानू! API से जवाब नहीं आ सका: " + err.message;
        speakText("API में दिक्कत आ गई जानू, एक बार चेक कर लीजिए।");
      }
    }

    async function forgeWebsite(prompt) {
      document.getElementById('lia-status').innerText = "🛠️ LIA वेबसाइट बना रही है...";
      if (liaOrb) liaOrb.material.color.setHex(0x00ff88);

      const sysCodePrompt = `Build a complete, animated single-file website with Tailwind CDN & GSAP for: "${prompt}". Return ONLY HTML starting with <!DOCTYPE html>.`;
      try {
        const html = await callGemini([{ parts: [{ text: sysCodePrompt }] }]);
        const clean = html.replace(/```html/g, '').replace(/```/g, '').trim();

        const frame = document.getElementById('result-frame');
        frame.srcdoc = clean;
        frame.style.display = 'block';
        document.getElementById('close-web-btn').classList.remove('hidden');
        document.getElementById('lia-speech').innerText = "लीजिए जानू! आपकी वेबसाइट तैयार है ❤️";
        speakText("लीजिए जानू, आपकी वेबसाइट तैयार है!");
      } catch(e) {
        document.getElementById('lia-speech').innerText = "वेबसाइट नहीं बन सकी जानू: " + e.message;
      }
    }

    function closeWebsite() {
      document.getElementById('result-frame').style.display = 'none';
      document.getElementById('close-web-btn').classList.add('hidden');
      document.getElementById('lia-speech').innerText = "वेबसाइट बंद कर दी। अब बताइए, क्या करना है?";
      speakText("वेबसाइट बंद कर दी।");
    }

    function getApiKey() { return localStorage.getItem('lia_gemini_key') || ''; }
    function saveApiKey() {
      const k = document.getElementById('api-key-input').value.trim();
      if (k) {
        localStorage.setItem('lia_gemini_key', k);
        toggleKeyModal();
        alert("API Key सेव हो गई!");
        toggleListening();
      }
    }
    function toggleKeyModal() {
      const m = document.getElementById('key-modal');
      m.classList.toggle('hidden');
      if (!m.classList.contains('hidden')) {
        document.getElementById('api-key-input').value = getApiKey();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSpeech();
      if (!getApiKey()) toggleKeyModal();
    });
  </script>
</body>
</html>
